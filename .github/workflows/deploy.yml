# =============================================================================
# VexarDrive Fleet Ping Service — CI/CD Pipeline
# Flow: Test → Lint → Security Scan → Build → Containerize → Push → Deploy → Verify
#
# Infrastructure provisioning (infra/terraform/core) is done ONCE per environment
# via the separate "provision-infrastructure" workflow (or manually). This
# pipeline handles application BUILD + DEPLOY via the split infra/terraform/app
# config, which reads the shared infrastructure back by name.
# =============================================================================

name: Fleet Ping Service CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore: ["infra/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      target_env:
        description: "Environment to provision shared infra to (infrastructure job only)"
        required: false
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code Quality & Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/

      - name: Run linter
        run: npm run lint
        working-directory: src/
        continue-on-error: true  # lint warnings don't block

      - name: Run tests
        run: npm test
        working-directory: src/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/junit.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Security Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: src/
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Job 3: Build & Push Container
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Container
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: src/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

  # ---------------------------------------------------------------------------
  # Job 4: Deploy to Staging (automatic) — app config only
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Deploy ONLY the app config (infra is provisioned once via core config)
      - name: Terraform Init (app/staging)
        working-directory: infra/terraform/app
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=app-staging-fleet-ping.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply (app/staging)
        id: deploy
        working-directory: infra/terraform/app
        run: |
          terraform apply -auto-approve \
            -var="environment=staging" \
            -var="key_vault_name=${{ secrets.KEY_VAULT_NAME_STAGING }}" \
            -var="container_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -var-file=environments/staging.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Verify staging deployment
        run: |
          sleep 30
          curl -fsS "https://${{ steps.deploy.outputs.app_url }}/ready" || echo "Deployment verification pending"

  # ---------------------------------------------------------------------------
  # Job 5: Deploy to Production (manual approval gate). app config only
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init (app/production)
        working-directory: infra/terraform/app
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=app-production-fleet-ping.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Plan (app/production)
        working-directory: infra/terraform/app
        run: |
          terraform plan -out=tfplan \
            -var="environment=production" \
            -var="key_vault_name=${{ secrets.KEY_VAULT_NAME_PROD }}" \
            -var="container_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -var-file=environments/production.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply (app/production)
        id: deploy
        working-directory: infra/terraform/app
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Verify production deployment
        run: |
          sleep 60
          curl -fsS "https://${{ steps.deploy.outputs.app_url }}/ready" || echo "Production verification pending"

      - name: Smoke test — ping endpoint
        run: |
          curl -s -X POST "https://${{ steps.deploy.outputs.app_url }}/api/fleet/ping" \
            -H "Content-Type: application/json" \
            -d '{"vehicleId":"test-001","lat":37.7749,"lng":-122.4194,"speed":0}' || echo "Smoke test pending"

  # ---------------------------------------------------------------------------
  # Job 6: Provision / change shared infrastructure (run rarely, manual)
  # ---------------------------------------------------------------------------
  provision-infrastructure:
    name: Provision Infrastructure (core)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env != ''
    environment:
      name: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init (core)
        working-directory: infra/terraform/core
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=core-fleet-ping.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply (core)
        working-directory: infra/terraform/core
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ github.event.inputs.target_env }}" \
            -var-file=environments/${{ github.event.inputs.target_env }}.tfvars
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Capture key vault name
        id: kv
        working-directory: infra/terraform/core
        run: |
          echo "key_vault_name=$(terraform output -raw key_vault_name)" >> $GITHUB_ENV
          echo "The key vault name is: $(terraform output -raw key_vault_name)"
          # Store this as a GitHub secret (KEY_VAULT_NAME_STAGING/PROD) for use by app deploys
